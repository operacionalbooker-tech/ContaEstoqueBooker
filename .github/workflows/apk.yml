name: Gerar APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrir projeto
        run: tar xzf android-projeto.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licencas Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk ContaEstoqueBooker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ContaEstoqueBooker-APK
          path: ContaEstoqueBooker.apk
